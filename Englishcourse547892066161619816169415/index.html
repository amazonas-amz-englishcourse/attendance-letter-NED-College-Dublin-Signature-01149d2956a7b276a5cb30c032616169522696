<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NED COLLEGE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #eef4fa; }
    .wrap { height: 100%; padding: 16px; overflow: auto;
            display: flex; align-items: center; justify-content: center; }
    .comprovante { max-width: 100%; max-height: 100%; object-fit: contain;
                   border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.12);
                   cursor: zoom-in; transition: all .15s ease; }
    /* Ao clicar: amplia e permite rolar para ver tudo */
    .comprovante.zoom { max-width: none; max-height: none; width: 170%;
                        cursor: zoom-out; border-radius: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="LETTER" src="ATTENDANCE.jpg"
         alt="ENGLISH COURSE"
         onclick="this.classList.toggle('zoom')">
  </div>
</body>
</html>
